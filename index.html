<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>中学受験 漢字トレーニング</title>
<meta name="robots" content="noindex,nofollow">

<style>
body{
    margin:0;
    background:#f5f3ee;
    font-family:"Yu Gothic","Meiryo",sans-serif;
}

header{
    background:#6b4b32;
    color:white;
    text-align:center;
    padding:35px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.button-area{
    text-align:center;
    margin:20px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#0066cc;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0054aa;
}

.card{
    background:white;
    margin-bottom:20px;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 5px rgba(0,0,0,.12);
}

.category{
    color:#666;
    font-size:0.9rem;
}

.question{
    font-size:1.8rem;
    margin-top:8px;
    font-weight:bold;
}

.answer{
    margin-top:15px;
    padding:15px;
    background:#eef5ff;
    border-left:5px solid #2367d1;
}

.links{
    margin-top:15px;
}

.links a{
    display:inline-block;
    margin-right:20px;
}

footer{
    text-align:center;
    padding:30px;
    color:#666;
}
</style>

</head>

<body>

<header>
    <h1>中学受験 漢字トレーニング</h1>
    <p>毎日10問の漢字・語彙問題</p>
    <div id="today"></div>
</header>

<div class="button-area">
    <button onclick="changeSet()">
        別の問題セットを表示
    </button>
</div>

<div class="container" id="quizArea">
    読込中...
</div>

<footer>
    Wikipediaと画像検索で理解を深めましょう
</footer>

<script>

let extraSeed = 0;

document.getElementById("today").textContent =
new Date().toLocaleDateString("ja-JP");

function seededRandom(seed){
    return function(){
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
    };
}

function loadQuiz(){

fetch("questions.json")
.then(response => response.json())
.then(data => {

    const today = new Date();

    const seed =
        today.getFullYear()*10000 +
        (today.getMonth()+1)*100 +
        today.getDate() +
        extraSeed;

    const rnd = seededRandom(seed);

    const selected =
        [...data]
        .sort(() => rnd() - 0.5)
        .slice(0,10);

    const area =
        document.getElementById("quizArea");

    area.innerHTML = "";

    selected.forEach((q,i)=>{

        const searchWord =
            q.type === "read"
            ? q.word
            : q.answer;

        const wikiUrl =
            "https://ja.wikipedia.org/wiki/" +
            encodeURIComponent(searchWord);

        const googleImage =
            "https://www.google.com/search?tbm=isch&q=" +
            encodeURIComponent(searchWord);

        area.innerHTML += `

        <div class="card">

            <div class="category">
                ${q.category || ""}
            </div>

            <div class="question">
                ${i+1}.
                ${q.type === "read"
                    ? "【読み】 " + q.word
                    : "【書き】 " + q.word}
            </div>

            <details>

                <summary>
                    解答・解説を見る
                </summary>

                <div class="answer">

                    <strong>答え：</strong>
                    ${q.answer || ""}

                    <br><br>

                    ${q.description || ""}

                    <div class="links">

                        <a href="${wikiUrl}"
                           target="_blank">
                           📖 Wikipedia
                        </a>

                        <a href="${googleImage}"
                           target="_blank">
                           🔍 画像検索
                        </a>

                    </div>

                </div>

            </details>

        </div>
        `;
    });

})
.catch(error => {

    document.getElementById("quizArea").innerHTML =
    "<p>questions.json の読込に失敗しました。</p>";

    console.error(error);

});

}

function changeSet(){

    extraSeed =
    Math.floor(Math.random()*100000);

    loadQuiz();

}

loadQuiz();

</script>

</body>
</html>
