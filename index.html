<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>中学受験 漢字トレーニング</title>

<meta name="robots" content="noindex,nofollow">

<style>

body{
    margin:0;
    background:#f5f3ee;
    font-family:"Yu Gothic","Meiryo",sans-serif;
    color:#333;
}

header{
    background:#6b4b32;
    color:white;
    text-align:center;
    padding:30px 15px;
}

header h1{
    margin:0;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.button-area{
    text-align:center;
    margin:20px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#0066cc;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0052a3;
}

.section-title{
    color:#6b4b32;
    border-bottom:3px solid #6b4b32;
    padding-bottom:6px;
    margin-top:40px;
}

.card{
    background:white;
    margin-bottom:20px;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 5px rgba(0,0,0,.12);
}

.category{
    color:#777;
    font-size:0.9rem;
}

.question{
    font-size:1.6rem;
    margin-top:10px;
    font-weight:bold;
}

.answer{
    margin-top:15px;
    padding:15px;
    background:#eef5ff;
    border-left:5px solid #2367d1;
}

.links{
    margin-top:15px;
}

.links a{
    margin-right:15px;
}

footer{
    text-align:center;
    padding:30px;
    color:#666;
}

details summary{
    cursor:pointer;
    margin-top:10px;
    font-weight:bold;
}

@media (max-width:768px){

    header{
        padding:20px 10px;
    }

    header h1{
        font-size:1.8rem;
    }

    .container{
        padding:10px;
    }

    .card{
        padding:15px;
    }

    .question{
        font-size:1.2rem;
        line-height:1.6;
    }

    button{
        width:95%;
        max-width:320px;
    }

    .links a{
        display:block;
        margin-bottom:10px;
    }

}
</style>
</head>

<body>

<header>
    <h1>中学受験 漢字トレーニング</h1>
    <p>読み10問＋書き10問</p>
    <div id="today"></div>
</header>

<div class="button-area">
    <button onclick="changeSet()">
        別の問題セットを表示
    </button>
</div>

<div class="container" id="quizArea">
    読込中...
</div>

<footer>
    難読漢字・四字熟語・故事成語・日本文化を学ぼう
</footer>

<script>

let extraSeed = 0;

document.getElementById("today").textContent =
new Date().toLocaleDateString("ja-JP");

function seededRandom(seed){
    return function(){
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
    };
}

function loadQuiz(){

fetch("questions.json")
.then(response => response.json())
.then(data => {

    const today = new Date();

    const seed =
        today.getFullYear() * 10000 +
        (today.getMonth()+1) * 100 +
        today.getDate() +
        extraSeed;

    const rnd = seededRandom(seed);

    const readQuestions =
        data
        .filter(q => q.type === "read")
        .sort(() => rnd() - 0.5)
        .slice(0,10);

    const writeQuestions =
        data
        .filter(q => q.type === "write")
        .sort(() => rnd() - 0.5)
        .slice(0,10);

    const area =
        document.getElementById("quizArea");

    area.innerHTML = "";

    createSection(
        area,
        "📖 読み問題",
        readQuestions
    );

    createSection(
        area,
        "✏️ 書き問題",
        writeQuestions
    );

});
}

function createSection(area,title,list){

    area.innerHTML +=
    `<h2 class="section-title">${title}</h2>`;

    list.forEach((q,index)=>{

        const searchWord =
            q.type === "read"
            ? q.word
            : q.answer;

        const wikiUrl =
            "https://ja.wikipedia.org/wiki/" +
            encodeURIComponent(searchWord);

        const imageUrl =
            "https://www.google.com/search?tbm=isch&q=" +
            encodeURIComponent(searchWord);

        area.innerHTML += `

        <div class="card">

            <div class="category">
                ${q.category || ""}
            </div>

            <div class="question">

                ${index + 1}.

                ${
                    q.type === "read"
                    ? "【読み】 " + q.word
                    : "【書き】 " + q.word
                }

            </div>

            <details>

                <summary>
                解答・解説を見る
                </summary>

                <div class="answer">

                    <strong>答え：</strong>
                    ${q.answer || ""}

                    <br><br>

                    ${q.description || ""}

                    <div class="links">

                        <a
                        href="${wikiUrl}"
                        target="_blank">

                        📖 Wikipedia

                        </a>

                        <a
                        href="${imageUrl}"
                        target="_blank">

                        🔍 画像検索

                        </a>

                    </div>

                </div>

            </details>

        </div>
        `;
    });
}

function changeSet(){

    extraSeed =
    Math.floor(Math.random()*100000);

    loadQuiz();

}

loadQuiz();

</script>

</body>
</html>
