<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>本日の漢字クイズ</title>

<meta name="robots" content="noindex,nofollow">

<style>
body{
    margin:0;
    background:#f4f1ea;
    font-family:"Yu Gothic","Meiryo",sans-serif;
    color:#333;
}

header{
    background:#6d4c41;
    color:white;
    text-align:center;
    padding:40px 20px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    margin:20px 0;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.question{
    font-size:1.8rem;
    font-weight:bold;
}

.answer{
    background:#eef4ff;
    margin-top:15px;
    padding:15px;
    border-left:5px solid #2469d9;
}

details summary{
    cursor:pointer;
    color:#2469d9;
    font-weight:bold;
    margin-top:15px;
}

.date{
    text-align:center;
    margin-top:10px;
    color:#ddd;
}

footer{
    text-align:center;
    padding:30px;
    color:#666;
}
</style>
</head>

<body>

<header>
    <h1>本日の漢字クイズ</h1>
    <div class="date" id="today"></div>
</header>

<div class="container" id="quizArea">
読込中...
</div>

<footer>
毎日自動で出題内容が変わります
</footer>

<script>

document.getElementById("today").textContent =
new Date().toLocaleDateString("ja-JP");

fetch("questions.json")
.then(res => res.json())
.then(data => {

    const today = new Date();

    const seed =
        today.getFullYear() * 10000 +
        (today.getMonth()+1) * 100 +
        today.getDate();

    function seededRandom(seed){
        return function(){
            seed = (seed * 9301 + 49297) % 233280;
            return seed / 233280;
        }
    }

    const rnd = seededRandom(seed);

    const questions = [...data]
        .sort(()=>rnd()-0.5)
        .slice(0,10);

    const area = document.getElementById("quizArea");
    area.innerHTML = "";

    questions.forEach((q,index)=>{

        area.innerHTML += `
        <div class="card">

            <div class="question">
            ${index+1}. ${q.word}
            </div>

            <details>
                <summary>解答・解説を見る</summary>

                <div class="answer">
                    <b>${q.reading}</b>
                    <br><br>
                    ${q.description}
                </div>
            </details>

        </div>
        `;

    });

});

</script>

</body>
</html>
