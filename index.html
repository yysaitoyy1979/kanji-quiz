<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>中学受験 漢字トレーニング</title>

<meta name="robots" content="noindex,nofollow">

<style>
body{
    margin:0;
    background:#f5f3ee;
    font-family:"Yu Gothic","Meiryo",sans-serif;
    color:#333;
}

header{
    background:#6b4b32;
    color:white;
    text-align:center;
    padding:30px 15px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.button-area{
    text-align:center;
    margin:20px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#0066cc;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0054aa;
}

.section-title{
    margin-top:40px;
    color:#6b4b32;
    border-bottom:3px solid #6b4b32;
    padding-bottom:8px;
}

.card{
    background:white;
    margin-bottom:20px;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 5px rgba(0,0,0,.12);
}

.category{
    font-size:0.9rem;
    color:#777;
}

.question{
    font-size:1.5rem;
    font-weight:bold;
    margin-top:10px;
}

.answer{
    margin-top:15px;
    padding:15px;
    background:#eef5ff;
    border-left:5px solid #2367d1;
}

.links{
    margin-top:15px;
}

.links a{
    margin-right:20px;
}

details summary{
    cursor:pointer;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:30px;
    color:#666;
}

@media (max-width:768px){

    .container{
        padding:10px;
    }

    .card{
        padding:15px;
    }

    .question{
        font-size:1.2rem;
        line-height:1.5;
    }

    button{
        width:95%;
        max-width:320px;
    }

    .links a{
        display:block;
        margin-bottom:10px;
    }
}
</style>
</head>

<body>

<header>
    <h1>中学受験 漢字トレーニング</h1>
    <p>読み10問＋書き10問</p>
    <div id="today"></div>
</header>

<div class="button-area">
    <button onclick="changeSet()">
        練習問題を作り直す
    </button>
</div>

<div class="container" id="quizArea">
    読込中...
</div>

<footer>
    Wikipediaと画像検索で理解を深めましょう
</footer>

<script>

let extraSeed = 0;

document.getElementById("today").textContent =
    new Date().toLocaleDateString("ja-JP");

function seededRandom(seed){
    return function(){
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
    };
}

function loadQuiz(){

Promise.all([

    fetch("questions.json").then(r => r.json()),

    fetch("questions2.json")
        .then(r => r.ok ? r.json() : [] )
        .catch(() => []),

    fetch("questions3.json")
        .then(r => r.ok ? r.json() : [] )
        .catch(() => [])

])

.then(results => {

    const data = [
        ...results[0],
        ...results[1],
        ...results[2]
    ];

    const today = new Date();

    const seed =
        today.getFullYear()*10000 +
        (today.getMonth()+1)*100 +
        today.getDate() +
        extraSeed;

    const rnd = seededRandom(seed);

    const shuffled =
        [...data]
        .sort(() => rnd() - 0.5);

    const readQuestions =
        shuffled.slice(0,10);

    const writeQuestions =
        shuffled.slice(10,20);

    const area =
        document.getElementById("quizArea");

    area.innerHTML = "";

    createReadSection(area, readQuestions);
    createWriteSection(area, writeQuestions);

})

.catch(error => {

    document.getElementById("quizArea").innerHTML = `
        <div style="color:red">
        問題ファイルの読み込みに失敗しました。
        </div>
    `;

    console.error(error);

});

}

function createReadSection(area,list){

    area.innerHTML +=
    `<h2 class="section-title">📖 読み問題</h2>`;

    list.forEach((q,index)=>{

        const wikiUrl =
            "https://ja.wikipedia.org/wiki/" +
            encodeURIComponent(q.kanji);

        const imageUrl =
            "https://www.google.com/search?tbm=isch&q=" +
            encodeURIComponent(q.kanji);

        area.innerHTML += `

        <div class="card">

            <div class="category">${q.category}</div>

            <div class="question">
                ${index+1}. ${q.kanji}
            </div>

            <details>

                <summary>解答・解説を見る</summary>

                <div class="answer">

                    <strong>答え：</strong>
                    ${q.reading}

                    <br><br>

                    ${q.description}

                    <div class="links">

                        <a href="${wikiUrl}" target="_blank">
                        📖 Wikipedia
                        </a>

                        <a href="${imageUrl}" target="_blank">
                        🔍 画像検索
                        </a>

                    </div>

                </div>

            </details>

        </div>
        `;
    });
}

function createWriteSection(area,list){

    area.innerHTML +=
    `<h2 class="section-title">✏️ 書き問題</h2>`;

    list.forEach((q,index)=>{

        const wikiUrl =
            "https://ja.wikipedia.org/wiki/" +
            encodeURIComponent(q.kanji);

        const imageUrl =
            "https://www.google.com/search?tbm=isch&q=" +
            encodeURIComponent(q.kanji);

        area.innerHTML += `

        <div class="card">

            <div class="category">${q.category}</div>

            <div class="question">
                ${index+1}. ${q.reading}
            </div>

            <details>

                <summary>解答・解説を見る</summary>

                <div class="answer">

                    <strong>答え：</strong>
                    ${q.kanji}

                    <br><br>

                    ${q.description}

                    <div class="links">

                        <a href="${wikiUrl}" target="_blank">
                        📖 Wikipedia
                        </a>

                        <a href="${imageUrl}" target="_blank">
                        🔍 画像検索
                        </a>

                    </div>

                </div>

            </details>

        </div>
        `;
    });
}

function changeSet(){

    extraSeed =
        Math.floor(
            Math.random() * 999999
        );

    loadQuiz();
}

loadQuiz();

</script>

</body>
</html>
