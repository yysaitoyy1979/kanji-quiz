<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>中学受験 漢字トレーニング</title>

<meta name="robots" content="noindex,nofollow">

<style>

body{
    margin:0;
    background:#f5f3ee;
    font-family:"Yu Gothic","Meiryo",sans-serif;
    color:#333;
}

header{
    background:#6b4b32;
    color:white;
    text-align:center;
    padding:30px 15px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.button-area{
    text-align:center;
    margin:20px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#0066cc;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0055aa;
}

.section-title{
    margin-top:40px;
    color:#6b4b32;
    border-bottom:3px solid #6b4b32;
    padding-bottom:8px;
}

.card{
    background:white;
    margin-bottom:20px;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 5px rgba(0,0,0,.12);
}

.category{
    color:#777;
    font-size:0.9rem;
}

.question{
    font-size:1.5rem;
    font-weight:bold;
    margin-top:10px;
}

.answer{
    margin-top:15px;
    padding:15px;
    background:#eef5ff;
    border-left:5px solid #2367d1;
}

.links{
    margin-top:15px;
}

.links a{
    display:inline-block;
    margin-right:15px;
}

details summary{
    cursor:pointer;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:30px;
    color:#666;
}

.error{
    color:red;
    text-align:center;
    padding:20px;
}

@media(max-width:768px){

    .container{
        padding:10px;
    }

    .card{
        padding:15px;
    }

    .question{
        font-size:1.2rem;
        line-height:1.5;
    }

    button{
        width:95%;
        max-width:320px;
    }

    .links a{
        display:block;
        margin-bottom:10px;
    }
}

</style>
</head>

<body>

<header>
<h1>中学受験 漢字トレーニング</h1>
<p>読み10問＋書き10問</p>
<div id="today"></div>
</header>

<div class="button-area">
<button onclick="changeSet()">
練習問題を作り直す
</button>
</div>

<div id="quizArea" class="container">
読込中...
</div>

<footer>
Wikipediaと画像検索で理解を深めましょう
</footer>

<script>

let extraSeed = 0;

const todayElement = document.getElementById("today");
if (todayElement) {
    todayElement.textContent = new Date().toLocaleDateString("ja-JP");
}

function seededRandom(seed){
    return function(){
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
    };
}

function createLinkButton(url, label, isWikipedia = false){
    const link = document.createElement("a");
    link.href = url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = isWikipedia ? "📖 Wikipedia" : "🔍 画像検索";
    return link;
}

function appendTextWithBreak(parent, text, addBreakBefore = false){
    if (addBreakBefore) {
        parent.appendChild(document.createElement("br"));
        parent.appendChild(document.createElement("br"));
    }
    parent.appendChild(document.createTextNode(text));
}

function createQuestionCard(question, index, isReadQuestion){
    const card = document.createElement("div");
    card.className = "card";

    const category = document.createElement("div");
    category.className = "category";
    category.textContent = question.category;
    card.appendChild(category);

    const questionNode = document.createElement("div");
    questionNode.className = "question";
    questionNode.textContent = `${index + 1}. ${isReadQuestion ? question.kanji : question.reading}`;
    card.appendChild(questionNode);

    const details = document.createElement("details");

    const summary = document.createElement("summary");
    summary.textContent = "解答・解説を見る";
    details.appendChild(summary);

    const answer = document.createElement("div");
    answer.className = "answer";

    const answerLabel = document.createElement("strong");
    answerLabel.textContent = "答え：";
    answer.appendChild(answerLabel);
    answer.appendChild(document.createTextNode(" "));
    answer.appendChild(document.createTextNode(isReadQuestion ? question.reading : question.kanji));
    answer.appendChild(document.createElement("br"));
    answer.appendChild(document.createElement("br"));
    answer.appendChild(document.createTextNode(question.description));

    const links = document.createElement("div");
    links.className = "links";

    const wikiUrl = "https://ja.wikipedia.org/wiki/" + encodeURIComponent((question.kanji || ""));
    const imageUrl = "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent((question.kanji || ""));

    links.appendChild(createLinkButton(wikiUrl, "Wikipedia", true));
    links.appendChild(createLinkButton(imageUrl, "画像検索", false));
    answer.appendChild(links);

    details.appendChild(answer);
    card.appendChild(details);

    return card;
}

function createSectionTitle(titleText){
    const heading = document.createElement("h2");
    heading.className = "section-title";
    heading.textContent = titleText;
    return heading;
}

async function loadQuiz(){

try{

    const results = await Promise.all([

        fetch("questions_kanji.json")
            .then(r => r.ok ? r.json() : [])
            .catch(() => []),

        fetch("questions_japan.json")
            .then(r => r.ok ? r.json() : [])
            .catch(() => []),

        fetch("questions_yojijukugo.json")
            .then(r => r.ok ? r.json() : [])
            .catch(() => []),

        fetch("questions_kojiseigo.json")
            .then(r => r.ok ? r.json() : [])
            .catch(() => []),

        fetch("questions_kotowaza.json")
            .then(r => r.ok ? r.json() : []),

        fetch("questions_kanyouku.json")
            .then(r => r.ok ? r.json() : [])
            .catch(() => [])

    ]);

    const data = results.flat();

    const area = document.getElementById("quizArea");

    if (!area) {
        return;
    }

    if(data.length < 20){
        area.innerHTML = "";
        const error = document.createElement("div");
        error.className = "error";
        error.textContent = "問題数が20問未満です。";
        area.appendChild(error);
        return;
    }

    const today = new Date();

    const seed =
        today.getFullYear()*10000 +
        (today.getMonth()+1)*100 +
        today.getDate() +
        extraSeed;

    const rnd = seededRandom(seed);

    const shuffled = [...data].sort(() => rnd()-0.5);

    const readQuestions = shuffled.slice(0,10);
    const writeQuestions = shuffled.slice(10,20);

    area.innerHTML = "";

    const readSection = document.createElement("section");
    readSection.appendChild(createSectionTitle("📖 読み問題"));
    readQuestions.forEach((q, index) => {
        readSection.appendChild(createQuestionCard(q, index, true));
    });

    const writeSection = document.createElement("section");
    writeSection.appendChild(createSectionTitle("✏️ 書き問題"));
    writeQuestions.forEach((q, index) => {
        writeSection.appendChild(createQuestionCard(q, index, false));
    });

    area.appendChild(readSection);
    area.appendChild(writeSection);

}
catch(error){

    const area = document.getElementById("quizArea");
    if (area) {
        area.innerHTML = "";
        const error = document.createElement("div");
        error.className = "error";
        error.textContent = "問題ファイルの読込に失敗しました";
        area.appendChild(error);
    }

    console.error(error);
}

}

function changeSet(){

    extraSeed = Math.floor(Math.random()*999999);
    loadQuiz();

}

loadQuiz();

</script>

</body>
</html>
